<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO Star Wars — Character Tracker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --yellow: #FFE81F;
  --gold: #c9a84c;
  --dark: #04040e;
  --card: #0d1117;
  --border: #1a2030;
  --text: #e0e0e0;
  --muted: #555;
}

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

canvas#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 1700px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ── Header ── */
header {
  text-align: center;
  padding: 40px 0 30px;
  border-bottom: 1px solid #ffe81f14;
  margin-bottom: 26px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}

.lego-badge {
  background: #FFE000;
  color: #000;
  font-weight: 900;
  font-size: 16px;
  padding: 4px 10px;
  border-radius: 5px;
  border: 2.5px solid #000;
  letter-spacing: 1px;
  line-height: 1.4;
  box-shadow: 0 3px 0 #999;
}

.sw-title {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 12px;
  color: var(--yellow);
  text-transform: uppercase;
  text-shadow: 0 0 40px #ffe81f55, 0 0 80px #ffe81f22;
}

.sub-title {
  font-size: 12px;
  letter-spacing: 7px;
  color: #777;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.tracker-label {
  font-size: 10px;
  letter-spacing: 4px;
  color: #333;
  text-transform: uppercase;
}

/* ── Progress ── */
.progress-section {
  background: #0a0d14;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 32px;
  margin-bottom: 22px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
}

#prog-count {
  font-size: 15px;
  font-weight: 500;
  color: #888;
  letter-spacing: 0.5px;
}

#prog-pct {
  font-size: 48px;
  font-weight: 900;
  color: var(--yellow);
  line-height: 1;
  text-shadow: 0 0 30px #ffe81f88;
  font-variant-numeric: tabular-nums;
}

.progress-track {
  height: 16px;
  background: #111827;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
}

#prog-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #5a3c00, var(--gold), var(--yellow), #fffacc, var(--yellow), var(--gold));
  background-size: 300% 100%;
  border-radius: 8px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 16px #ffe81f66, 0 0 4px #ffe81f;
  animation: shimmer 4s linear infinite;
}

@keyframes shimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: -200% 0; }
}

/* ── Controls ── */
.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

#filters {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  flex: 1;
}

#filters button {
  background: transparent;
  border: 1px solid var(--border);
  color: #777;
  padding: 7px 14px;
  border-radius: 22px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.16s;
  white-space: nowrap;
  line-height: 1.2;
}

#filters button span {
  font-size: 10px;
  opacity: 0.55;
  margin-left: 5px;
}

#filters button:hover {
  color: var(--yellow);
  border-color: #ffe81f33;
  background: #ffe81f08;
}

#filters button.active {
  background: var(--yellow);
  color: #000;
  border-color: var(--yellow);
  font-weight: 700;
  box-shadow: 0 0 12px #ffe81f44;
}

#filters button.active span { opacity: 0.6; }

#search {
  background: #0a0d14;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 18px;
  border-radius: 22px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  width: 230px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#search:focus {
  border-color: #ffe81f44;
  box-shadow: 0 0 0 3px #ffe81f11;
}

#search::placeholder { color: #3a3a4a; }

/* ── Grid ── */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 10px;
}

/* ── Cards ── */
.card {
  position: relative;
  border-radius: 11px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--card);
  aspect-ratio: 2 / 3;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
  user-select: none;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
  border-color: #ffe81f66;
  box-shadow: 0 14px 36px rgba(0,0,0,0.55), 0 0 20px #ffe81f22;
  z-index: 2;
}

.card.collected {
  border-color: var(--yellow);
  box-shadow: 0 0 18px #ffe81f44, 0 0 6px #ffe81f;
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  opacity: 0.45;
  transition: opacity 0.2s;
}

.card.collected img { opacity: 1; }
.card:hover img     { opacity: 0.85; }

.card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 35%, rgba(0,0,0,0.97) 100%);
  pointer-events: none;
}

.card-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 8px 9px;
  pointer-events: none;
}

.cat-bar {
  height: 2px;
  border-radius: 1px;
  margin-bottom: 5px;
  width: 100%;
  opacity: 0.9;
}

.card-name {
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.35;
  color: #bbb;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card.collected .card-name { color: #fff; }

.check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 22px;
  height: 22px;
  background: var(--yellow);
  color: #000;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
  z-index: 3;
  box-shadow: 0 0 10px #ffe81faa;
}

.dlc-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: #6a1bab;
  color: #d4aaff;
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  z-index: 3;
  border: 1px solid #9c4dcc55;
}

/* when both dlc badge + check are shown, prevent overlap */
.card.collected .dlc-badge { top: 38px; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  color: #333;
  padding: 100px 20px;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── Reset button ── */
.reset-btn {
  position: fixed;
  bottom: 22px;
  right: 22px;
  background: #0d1117;
  border: 1px solid var(--border);
  color: #444;
  padding: 9px 16px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  z-index: 10;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}

.reset-btn:hover {
  color: #ef5350;
  border-color: #ef535055;
  background: #1a0808;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: #1a2030; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #263040; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="app">
  <header>
    <div class="brand">
      <span class="lego-badge">LEGO®</span>
      <span class="sw-title">STAR WARS</span>
    </div>
    <div class="sub-title">The Skywalker Saga</div>
    <div class="tracker-label">Character Collection Tracker</div>
  </header>

  <section class="progress-section">
    <div class="progress-header">
      <span id="prog-count">0 / 0 Characters Collected</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-track">
      <div id="prog-fill"></div>
    </div>
  </section>

  <div class="controls">
    <nav id="filters"></nav>
    <input type="text" id="search" placeholder="Search characters...">
  </div>

  <div id="grid"></div>
</div>

<button class="reset-btn" onclick="resetAll()">Reset All Progress</button>

<script src="characters.js"></script>
<script src="app.js"></script>
</body>
</html>
